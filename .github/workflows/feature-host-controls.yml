name: Feature host controls

on:
  pull_request:
    branches: [feature/l1-handoff]

permissions:
  contents: read

concurrency:
  group: feature-host-controls-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  com-pit:
    name: Legacy COM and quick PIT host controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and run the legacy COM control
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/legacy_com_test.c -o "$RUNNER_TEMP/legacy-com"
          "$RUNNER_TEMP/legacy-com"
      - name: Compile and run the quick PIT control
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/pit_quick_test.c -o "$RUNNER_TEMP/pit-quick"
          "$RUNNER_TEMP/pit-quick"

  guest-uefi:
    name: Guest UEFI boot contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and run the guest map-key handoff
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/guest_uefi_map_test.c -o "$RUNNER_TEMP/guest-map"
          "$RUNNER_TEMP/guest-map"
      - name: Check the inert split-flash reset window
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/ovmf_flash_test.c -o "$RUNNER_TEMP/ovmf-flash"
          "$RUNNER_TEMP/ovmf-flash"

  winpe-storage:
    name: Windows installer storage inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check synthetic WinPE driver evidence
        run: python3 -B -m unittest -v lab.tests.winpe_storage_test
      - name: Distinguish the optical child from its controller and a disk
        run: python3 -B -m unittest -v lab.tests.winpe_optical_test
      - name: Verify bounded optical sector witnesses
        run: python3 -B -m unittest -v lab.tests.install_content_witness_test lab.tests.install_udf_extent_test
      - name: Check the two-sector optical READ(10)
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/optical_read10_test.c -o "$RUNNER_TEMP/optical-read10"
          "$RUNNER_TEMP/optical-read10"
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/optical_read10_replay.c -o "$RUNNER_TEMP/optical-replay"
          python3 -B lab/tests/check_optical_replay.py "$RUNNER_TEMP/optical-replay"

  master-pic:
    name: Shared master PIC arbitration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and run the IRQ0 and IRQ4 control
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/pit_uart_pic_test.c -o "$RUNNER_TEMP/pit-uart-pic"
          "$RUNNER_TEMP/pit-uart-pic"
      - name: Compile and run the shared SCI arbitration control
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/shared_sci_pic_test.c -o "$RUNNER_TEMP/shared-sci"
          "$RUNNER_TEMP/shared-sci"
      - name: Compile and run the terminal device shutdown control
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/platform_s5_test.c -o "$RUNNER_TEMP/platform-s5"
          "$RUNNER_TEMP/platform-s5"
      - name: Compile and run the shared platform clock control
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/platform_clock_test.c -o "$RUNNER_TEMP/platform-clock"
          "$RUNNER_TEMP/platform-clock"
      - name: Compile and run the bounded UART capture control
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/platform_s5_tx_test.c -o "$RUNNER_TEMP/platform-tx"
          "$RUNNER_TEMP/platform-tx"

  cpu-state:
    name: Legacy CPU state host controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and run the cold floating-point image control
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/fp_cold_test.c -o "$RUNNER_TEMP/fp-cold"
          "$RUNNER_TEMP/fp-cold"
      - name: Verify Windows topology record fixtures without querying a host
        run: python3 -B -m unittest -v lab.tests.win_core_inventory_test
