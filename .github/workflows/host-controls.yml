name: Host controls

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-npt:
    name: Fixed NPT host control
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the fixed GPA mapping and permissions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror lab/tests/fixed_npt_test.c -o "$RUNNER_TEMP/fixed-npt"
          "$RUNNER_TEMP/fixed-npt"
