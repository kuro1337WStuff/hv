name: Journal analytics
on:
  pull_request:
    branches: [main]
    paths:
      - 'lab/measurement/**'
      - 'journal/reports/**'
      - '.github/workflows/journal-analytics.yml'
permissions:
  contents: read
jobs:
  reproduce:
    name: Reproduce journal analytics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check measurement and reporting controls
        run: python3 -B -m unittest discover -v -s lab/measurement
      - name: Regenerate both views and compare exact bytes
        run: |
          python3 -B lab/measurement/journal_analytics.py journal/reports/analytics.json --output-dir "$RUNNER_TEMP"
          cmp journal/reports/functional-outcomes.svg "$RUNNER_TEMP/functional-outcomes.svg"
          cmp journal/reports/benchmark-ledger.svg "$RUNNER_TEMP/benchmark-ledger.svg"
