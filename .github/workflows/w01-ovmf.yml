name: Pinned W01 guest firmware

on:
  push:
    branches: [feature/w01-ovmf-sec]
    paths: ['lab/w01/build.sh', '.github/workflows/w01-ovmf.yml']

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/tianocore/containers/fedora-43-dev@sha256:2f4f0940f072aa8f67df7148d89f033be9fa0626d0a03d36c1d223c911bc7e9b
      options: --user 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the reviewed split flash and record its hashes
        shell: bash
        run: |
          bash lab/w01/build.sh
          cd build/w01
          sha256sum W01CODE.FD W01VARS.FD | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w01-split-flash
          path: build/w01/
          if-no-files-found: error
          retention-days: 14
