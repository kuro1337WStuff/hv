<svg xmlns="http://www.w3.org/2000/svg" width="752" height="314" viewBox="0 0 752 314" role="img" aria-labelledby="title description" font-family="system-ui, sans-serif">
  <title id="title">Nested lab: one guest store with two outcomes</title>
  <desc id="description">Trial 039 on the Ryzen 9 9950X. Hyper-V hosts the standalone L1 hypervisor. L1 sets the nested page permission for a fixed L2 guest. With writing allowed, its store changes the backing byte from hexadecimal 5A to A5 and the guest halts. After L1 resets the byte, revokes write permission and requests a local flush, the same store faults, leaving 5A intact.</desc>
  <rect width="752" height="314" rx="12" fill="#142832"/>
  <g fill="#f6f7ed">
    <text x="24" y="30" fill="#b3e4d7" font-size="13" font-weight="700" letter-spacing="1.8">01 / NESTED LAB</text>
    <text x="24" y="65" font-size="29" font-weight="700">One store, two outcomes</text>
    <text x="728" y="59" text-anchor="end" fill="#b3e4d7" font-size="15">039 / FIXED GUEST</text>
  </g>
  <g stroke-width="1.5">
    <rect x="24" y="83" width="370" height="209" rx="8" fill="#203c48" stroke="#71939a"/>
    <rect x="43" y="136" width="333" height="138" rx="6" fill="#2d535b" stroke="#85beb9"/>
    <rect x="63" y="188" width="295" height="67" rx="4" fill="#d7eee4" stroke="#d7eee4"/>
  </g>
  <g fill="#f5f8f1">
    <text x="42" y="116" font-size="19" font-weight="650">L0 · Hyper-V</text>
    <text x="374" y="115" text-anchor="end" fill="#c4dadb" font-size="15">Ryzen 9 9950X</text>
    <text x="62" y="168" font-size="19" font-weight="650">L1 · Standalone AMD SVM / NPT</text>
  </g>
  <g fill="#153e3b">
    <text x="80" y="214" font-size="18" font-weight="700">L2 · Fixed guest</text>
    <text x="80" y="238" font-size="15">Store 0xA5 at guest address 0x2000</text>
  </g>
  <rect x="410" y="83" width="318" height="209" rx="8" fill="#f5f4e9"/>
  <path d="M428 181h282" fill="none" stroke="#b2bab3"/>
  <g fill="#183940">
    <text x="430" y="110" fill="#246654" font-size="14" font-weight="750" letter-spacing="1">A / WRITE ALLOWED</text>
    <text x="430" y="139" font-family="ui-monospace, Consolas, monospace" font-size="24" font-weight="700">0x5A → 0xA5</text>
    <text x="430" y="164" font-size="16">Store completes; guest halts.</text>
    <text x="430" y="209" fill="#82522d" font-size="14" font-weight="750" letter-spacing="1">B / WRITE REVOKED</text>
    <text x="430" y="238" font-family="ui-monospace, Consolas, monospace" font-size="24" font-weight="700">0x5A → 0x5A</text>
    <text x="430" y="264" font-size="16">Same store faults; byte unchanged.</text>
  </g>
</svg>
