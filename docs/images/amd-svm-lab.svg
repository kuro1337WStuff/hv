<svg xmlns="http://www.w3.org/2000/svg" width="560" height="304" viewBox="0 0 560 304" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
  <title id="title">Where the standalone AMD SVM hypervisor runs</title>
  <desc id="desc">In the nested development lab on a Ryzen 9 9950X, Hyper-V (L0) hosts the standalone AMD SVM hypervisor (L1), which runs a fixed guest (L2). In the CPUID test the guest exits to L1's handler, then L1 resumes the guest. The Ryzen 9 9950X3D is a separate, not yet qualified bare-metal target.</desc>

  <rect width="560" height="304" rx="12" fill="#f7fafc"/>
  <g fill="#152e43" font-size="22">
    <text x="18" y="34" font-weight="700">Nested development lab</text>
    <text x="542" y="34" text-anchor="end">Ryzen 9 9950X</text>
  </g>

  <rect x="12" y="48" width="536" height="172" rx="8" fill="#223e55"/>
  <text x="28" y="78" fill="#ffffff" font-size="22" font-weight="650">L0 · Hyper-V</text>
  <rect x="26" y="91" width="508" height="116" rx="5" fill="#e3f4ef"/>
  <text x="40" y="119" fill="#104e44" font-size="22" font-weight="700">L1 · Standalone AMD SVM</text>
  <text x="40" y="169" fill="#104e44" font-size="21">Exit handler</text>

  <g fill="none" stroke="#22685b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 345,152 H 169 m 8,-6 -8,6 8,6"/>
    <path d="M 169,177 H 345 m -8,-6 8,6 -8,6"/>
  </g>
  <g fill="#104e44" font-size="19" text-anchor="middle">
    <text x="257" y="145">CPUID exit</text>
    <text x="257" y="198">resume</text>
  </g>
  <rect x="349" y="128" width="173" height="70" rx="5" fill="#ffffff" stroke="#34796c" stroke-width="2"/>
  <text x="435.5" y="170" text-anchor="middle" fill="#153e37" font-size="21" font-weight="650">L2 · Fixed guest</text>

  <rect x="13" y="235" width="534" height="57" rx="7" fill="#fffaf0" stroke="#85642b" stroke-width="2" stroke-dasharray="7 5"/>
  <g fill="#513c1c">
    <text x="28" y="260" font-size="21" font-weight="700">Bare-metal target</text>
    <text x="28" y="282" font-size="18">Not yet qualified</text>
    <text x="532" y="272" text-anchor="end" font-size="22">Ryzen 9 9950X3D</text>
  </g>
</svg>
