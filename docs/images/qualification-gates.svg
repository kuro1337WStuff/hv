<svg xmlns="http://www.w3.org/2000/svg" width="752" height="308" viewBox="0 0 752 308" role="img" aria-labelledby="title description" font-family="system-ui, sans-serif">
  <title id="title">From nested bring-up to Windows 10 on physical AMD hardware</title>
  <desc id="description">Pinned Linux is an engineering gate, not the product. Rehearse Windows 10 in a disposable VM. Physical qualification is a separate operator decision for a 9950X or 9950X3D, using every enabled core and thread. No Windows or physical run has passed.</desc>
  <rect x="1" y="1" width="750" height="306" rx="12" fill="#f6f4e9" stroke="#a1ada8"/>
  <text x="24" y="32" fill="#356153" font-size="13" font-weight="700" letter-spacing="1.8">02 / QUALIFICATION</text>
  <text x="24" y="67" fill="#18333b" font-size="28" font-weight="700">Path to Windows 10 on bare metal</text>
  <g fill="none" stroke="#54736c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M285 190h32 M317 190v-55h35 m-7 -5 7 5 -7 5 M317 190v54h35 m-7 -5 7 5 -7 5"/>
    <circle cx="317" cy="190" r="4" fill="#f6f4e9"/>
  </g>
  <rect x="24" y="110" width="261" height="160" rx="7" fill="#213f46"/>
  <g fill="#f6f7ed">
    <text x="43" y="138" fill="#b8e6d9" font-size="13" font-weight="700" letter-spacing="1">LAB GATE / NOT YET PASSED</text>
    <text x="43" y="170" font-size="21" font-weight="700">Pinned Linux L2</text>
    <text x="43" y="197" font-size="16">Two fresh boots under Hyper-V</text>
    <text x="43" y="222" font-size="16">PID 1, console, advancing ticks</text>
    <text x="43" y="246" font-size="16">and an orderly shutdown</text>
  </g>
  <g fill="#fffef8" stroke="#647970" stroke-width="1.5" stroke-dasharray="6 4">
    <rect x="359" y="87" width="369" height="96" rx="7"/>
    <rect x="359" y="196" width="369" height="96" rx="7"/>
  </g>
  <g fill="#18333b">
    <text x="377" y="111" fill="#356153" font-size="13" font-weight="700" letter-spacing="1">WINDOWS REHEARSAL / NESTED</text>
    <text x="377" y="139" font-size="20" font-weight="700">Windows 10 on a disposable VM</text>
    <text x="377" y="164" font-size="16">Boot Manager → installed OS → diagnostics</text>
    <text x="377" y="220" fill="#785330" font-size="13" font-weight="700" letter-spacing="1">DEPLOYMENT TARGET / NOT QUALIFIED</text>
    <text x="377" y="248" font-size="20" font-weight="700">Windows 10 · 9950X3D or 9950X</text>
    <text x="377" y="273" font-size="16">All enabled processors; recovery required</text>
  </g>
</svg>
