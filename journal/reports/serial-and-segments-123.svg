<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 545" width="960" height="545"><title id="title">Serial capture and Linux segment placement</title><desc id="desc">Evidence by execution scope, with trial and source references. No matched performance measurement has been published in this report.</desc><rect width="960" fill="#eef3f5" height="545" /><rect x="0" y="0" width="960" height="106" rx="0" fill="#142f40" /><text font-family="monospace" font-size="14" font-weight="700" x="28" y="32" fill="#8de0ce">FIELD JOURNAL   /   EVIDENCE REPORT</text><text font-family="monospace" font-size="27" font-weight="700" x="28" y="78" fill="#ffffff">Serial capture and Linux segment placement</text><text font-family="system-ui, sans-serif" font-size="23" font-weight="700" x="28" y="145" fill="#142938">01   Recorded outcomes</text><text font-family="system-ui, sans-serif" font-size="16" font-weight="400" x="28" y="170" fill="#142938">Each outcome applies only to its named check and execution scope.</text><rect x="24" y="186" width="912" height="96" rx="8" fill="#ffffff" /><rect x="24" y="196" width="4" height="76" rx="2" fill="#145640" /><text font-family="monospace" font-size="17" font-weight="700" x="42" y="214" fill="#142938">Bounded shared UART capture</text><text font-family="monospace" font-size="15" font-weight="700" x="665" y="214" fill="#142938">HOST</text><rect x="788" y="194" width="132" height="29" rx="6" fill="#145640" /><text font-family="monospace" font-size="15" font-weight="700" x="801" y="214" fill="#ffffff">PASSED</text><text font-family="monospace" font-size="15" font-weight="400" x="42" y="242" fill="#142938">Trial 122  /  commit 4cb670333182</text><text font-family="monospace" font-size="14" font-weight="400" x="42" y="265" fill="#445b68">journal/trials/122.md</text><rect x="24" y="288" width="912" height="96" rx="8" fill="#ffffff" /><rect x="24" y="298" width="4" height="76" rx="2" fill="#145640" /><text font-family="monospace" font-size="17" font-weight="700" x="42" y="316" fill="#142938">Overlapping ELF file moves</text><text font-family="monospace" font-size="15" font-weight="700" x="665" y="316" fill="#142938">HOST</text><rect x="788" y="296" width="132" height="29" rx="6" fill="#145640" /><text font-family="monospace" font-size="15" font-weight="700" x="801" y="316" fill="#ffffff">PASSED</text><text font-family="monospace" font-size="15" font-weight="400" x="42" y="344" fill="#142938">Trial 123  /  commit bc1407c13c68</text><text font-family="monospace" font-size="14" font-weight="400" x="42" y="367" fill="#445b68">journal/trials/123.md</text><text font-family="system-ui, sans-serif" font-size="23" font-weight="700" x="28" y="427" fill="#142938">02   Performance</text><rect x="24" y="444" width="912" height="77" rx="8" fill="#dfe8ed" /><text font-family="monospace" font-size="17" font-weight="700" x="42" y="474" fill="#142938">UNMEASURED</text><text font-family="system-ui, sans-serif" font-size="16" font-weight="400" x="42" y="500" fill="#142938">No matched timing cohorts in this report. Functional outcomes are not speed measurements.</text></svg>
